<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" role="img" aria-labelledby="title desc">
  <title id="title">Monitoring and centralized logging architecture</title>
  <desc id="desc">Node Exporter, Nginx Exporter and cAdvisor provide metrics from proxy and backend managed instance groups to Prometheus. Grafana Alloy sends Linux, Nginx and Docker logs to Loki. Grafana presents metrics and logs from both data stores.</desc>
  <defs>
    <marker id="metric-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2878c8"/></marker>
    <marker id="log-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#8056c7"/></marker>
    <marker id="query-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#15947b"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #183047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52657a; }
      .boundary-title { font-size: 14px; font-weight: 700; fill: #42617f; letter-spacing: .6px; }
      .group-title { font-size: 17px; font-weight: 700; }
      .service-title { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; fill: #42566b; }
      .small { font-size: 11.5px; fill: #52657a; }
      .tiny { font-size: 10.5px; fill: #61758a; }
      .panel { fill: #fff; stroke: #cbd6e2; stroke-width: 1.5; }
      .proxy { fill: #f1f7ff; stroke: #8bb5e3; stroke-width: 1.5; }
      .backend { fill: #f2f8f5; stroke: #91c6ae; stroke-width: 1.5; }
      .metric-card { fill: #edf5ff; stroke: #9bbfe5; stroke-width: 1.2; }
      .log-card { fill: #f5f0ff; stroke: #b6a0df; stroke-width: 1.2; }
      .green-card { fill: #ebf8f4; stroke: #83c2ad; stroke-width: 1.2; }
      .metric-line { fill: none; stroke: #2878c8; stroke-width: 2.6; marker-end: url(#metric-arrow); }
      .log-line { fill: none; stroke: #8056c7; stroke-width: 2.6; marker-end: url(#log-arrow); }
      .query-line { fill: none; stroke: #15947b; stroke-width: 2.2; stroke-dasharray: 7 5; marker-end: url(#query-arrow); }
    </style>
  </defs>

  <rect width="1560" height="900" fill="#f5f8fc"/>
  <text x="52" y="58" class="title">Monitoring &amp; Centralized Logging</text>
  <text x="52" y="87" class="subtitle">Prometheus collects metrics, Alloy ships logs to Loki, and Grafana brings both views together.</text>

  <rect x="48" y="132" width="1464" height="660" rx="20" fill="#eef5fc" stroke="#8eaccb" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="70" y="117" width="385" height="30" rx="7" fill="#eef5fc"/>
  <text x="82" y="138" class="boundary-title">GCP VPC · PROXY + BACKEND MIGs · OBSERVABILITY VM</text>

  <!-- Proxy MIG sources -->
  <rect x="75" y="205" width="690" height="245" rx="16" class="proxy"/>
  <text x="98" y="238" class="group-title">Proxy MIG</text>
  <text x="745" y="237" text-anchor="end" class="small">us-central1-a + us-central1-b</text>

  <rect x="96" y="260" width="195" height="145" rx="11" class="panel"/>
  <text x="114" y="289" class="service-title">Linux VM</text>
  <text x="114" y="317" class="body">Node Exporter</text>
  <text x="114" y="339" class="small">CPU · memory · disk</text>
  <text x="114" y="358" class="small">network · uptime</text>
  <rect x="114" y="372" width="112" height="22" rx="11" fill="#e6f1fc"/>
  <text x="170" y="387" text-anchor="middle" class="tiny">metrics :9100</text>

  <rect x="310" y="260" width="205" height="145" rx="11" class="panel"/>
  <text x="328" y="289" class="service-title">Nginx</text>
  <text x="328" y="317" class="body">stub_status → Exporter</text>
  <text x="328" y="339" class="small">request rate · connections</text>
  <text x="328" y="358" class="small">access + error logs</text>
  <rect x="328" y="372" width="154" height="22" rx="11" fill="#e6f1fc"/>
  <text x="405" y="387" text-anchor="middle" class="tiny">exporter :9113</text>

  <rect x="534" y="260" width="205" height="145" rx="11" class="log-card"/>
  <text x="552" y="289" class="service-title">Grafana Alloy</text>
  <text x="552" y="317" class="body">Collects host logs</text>
  <text x="552" y="339" class="small">syslog · auth · journal</text>
  <text x="552" y="358" class="small">Nginx access + error</text>
  <rect x="552" y="372" width="108" height="22" rx="11" fill="#eee7fb"/>
  <text x="606" y="387" text-anchor="middle" class="tiny">push logs</text>

  <!-- Backend MIG sources -->
  <rect x="75" y="485" width="690" height="270" rx="16" class="backend"/>
  <text x="98" y="518" class="group-title">Backend / App MIG</text>
  <text x="745" y="517" text-anchor="end" class="small">us-central1-a + us-central1-b</text>

  <rect x="96" y="540" width="195" height="165" rx="11" class="panel"/>
  <text x="114" y="570" class="service-title">Linux VM</text>
  <text x="114" y="599" class="body">Node Exporter</text>
  <text x="114" y="621" class="small">CPU · memory · disk</text>
  <text x="114" y="640" class="small">network · uptime</text>
  <rect x="114" y="667" width="112" height="22" rx="11" fill="#e6f1fc"/>
  <text x="170" y="682" text-anchor="middle" class="tiny">metrics :9100</text>

  <rect x="310" y="540" width="205" height="165" rx="11" class="panel"/>
  <text x="328" y="570" class="service-title">Docker</text>
  <text x="328" y="596" class="body">Go app + PostgreSQL</text>
  <text x="328" y="621" class="small">cAdvisor: CPU · memory</text>
  <text x="328" y="640" class="small">container status · OOM</text>
  <rect x="328" y="667" width="118" height="22" rx="11" fill="#e6f1fc"/>
  <text x="387" y="682" text-anchor="middle" class="tiny">metrics :8080</text>

  <rect x="534" y="540" width="205" height="165" rx="11" class="log-card"/>
  <text x="552" y="570" class="service-title">Grafana Alloy</text>
  <text x="552" y="599" class="body">Collects host logs</text>
  <text x="552" y="621" class="small">syslog · auth</text>
  <text x="552" y="640" class="small">Docker app + DB logs</text>
  <rect x="552" y="667" width="108" height="22" rx="11" fill="#eee7fb"/>
  <text x="606" y="682" text-anchor="middle" class="tiny">push logs</text>

  <!-- Observability services -->
  <rect x="835" y="205" width="645" height="550" rx="16" class="panel"/>
  <text x="860" y="239" class="group-title">Observability VM</text>
  <text x="1455" y="238" text-anchor="end" class="small">Docker Compose · us-central1-a</text>

  <rect x="860" y="265" width="300" height="180" rx="13" class="metric-card"/>
  <text x="884" y="298" class="service-title">Prometheus</text>
  <text x="884" y="326" class="body">GCE service discovery</text>
  <text x="884" y="348" class="small">scrapes every 15 seconds</text>
  <text x="884" y="374" class="small">Node Exporter · Nginx Exporter</text>
  <text x="884" y="394" class="small">cAdvisor · stores metrics 15 days</text>
  <rect x="884" y="408" width="118" height="22" rx="11" fill="#dcecff"/>
  <text x="943" y="423" text-anchor="middle" class="tiny">PromQL :9090</text>

  <rect x="860" y="530" width="300" height="185" rx="13" class="log-card"/>
  <text x="884" y="563" class="service-title">Loki</text>
  <text x="884" y="591" class="body">Central log storage</text>
  <text x="884" y="615" class="small">receives Alloy log pushes</text>
  <text x="884" y="637" class="small">filesystem · 7-day retention</text>
  <rect x="884" y="668" width="112" height="22" rx="11" fill="#eee7fb"/>
  <text x="940" y="683" text-anchor="middle" class="tiny">push API :3100</text>

  <rect x="1200" y="390" width="245" height="170" rx="13" class="green-card"/>
  <text x="1224" y="425" class="service-title">Grafana</text>
  <text x="1224" y="455" class="body">Dashboards</text>
  <text x="1224" y="480" class="small">metrics + logs</text>
  <text x="1224" y="505" class="small">Prometheus + Loki sources</text>
  <rect x="1224" y="522" width="106" height="22" rx="11" fill="#dff3ec"/>
  <text x="1277" y="537" text-anchor="middle" class="tiny">web UI :3000</text>

  <!-- Metrics flow from each workload group -->
  <path d="M860 310 H765" class="metric-line"/>
  <text x="812" y="296" text-anchor="middle" class="tiny">scrape</text>
  <path d="M860 420 H800 V570 H765" class="metric-line"/>
  <text x="802" y="555" text-anchor="middle" class="tiny">scrape</text>

  <!-- Log flow from each workload group -->
  <path d="M765 425 H782 V645 H835" class="log-line"/>
  <path d="M765 685 H835" class="log-line"/>

  <!-- Grafana reads both data stores -->
  <path d="M1200 430 H1180 V355 H1160" class="query-line"/>
  <path d="M1200 520 H1180 V625 H1160" class="query-line"/>
  <text x="1190" y="372" text-anchor="end" class="tiny">query</text>
  <text x="1190" y="607" text-anchor="end" class="tiny">query</text>

  <!-- Legend -->
  <line x1="76" y1="836" x2="126" y2="836" class="metric-line"/>
  <text x="140" y="841" class="small">Metrics scrape</text>
  <line x1="285" y1="836" x2="335" y2="836" class="log-line"/>
  <text x="349" y="841" class="small">Log push</text>
  <line x1="465" y1="836" x2="515" y2="836" class="query-line"/>
  <text x="529" y="841" class="small">Grafana queries</text>
  <text x="1480" y="841" text-anchor="end" class="small">High-level view · collector ports shown for reference</text>
</svg>
