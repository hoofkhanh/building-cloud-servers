<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">GCP application traffic architecture</title>
  <desc id="desc">Internet requests flow through an external Application Load Balancer, a multi-zone Nginx proxy managed instance group, an internal passthrough load balancer, and a multi-zone Docker backend managed instance group.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#52657a"/></marker>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #183047; }
      .title { font-size: 29px; font-weight: 700; }
      .sub { font-size: 15px; fill: #52657a; }
      .vpc-title { font-size: 14px; font-weight: 700; fill: #42617f; letter-spacing: .6px; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; fill: #42566b; }
      .small { font-size: 11.5px; fill: #52657a; }
      .card { fill: #fff; stroke: #cbd6e2; stroke-width: 1.5; }
      .blue { fill: #edf5ff; stroke: #79a9dc; stroke-width: 1.5; }
      .edge { fill: none; stroke: #2673c9; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1500" height="620" fill="#f5f8fc"/>
  <text x="52" y="55" class="title">Application Traffic &amp; High Availability</text>
  <text x="52" y="84" class="sub">Public requests enter through Nginx and reach private backend services through two load-balancing layers.</text>

  <rect x="500" y="150" width="955" height="350" rx="18" fill="#eef5fc" stroke="#8eaccb" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="520" y="136" width="310" height="28" rx="7" fill="#eef5fc"/>
  <text x="532" y="155" class="vpc-title">PRIVATE VPC · MULTI-ZONE VM WORKLOADS</text>

  <rect x="50" y="255" width="160" height="120" rx="14" class="card"/>
  <text x="130" y="303" text-anchor="middle" class="heading">Internet users</text>
  <text x="130" y="331" text-anchor="middle" class="small">Public HTTP traffic</text>

  <rect x="260" y="235" width="205" height="160" rx="14" class="blue"/>
  <text x="362" y="279" text-anchor="middle" class="heading">External</text>
  <text x="362" y="303" text-anchor="middle" class="heading">Application LB</text>
  <text x="362" y="339" text-anchor="middle" class="small">Regional public endpoint</text>
  <text x="362" y="362" text-anchor="middle" class="small">HTTP :80</text>

  <rect x="530" y="207" width="275" height="230" rx="14" class="card"/>
  <text x="667" y="245" text-anchor="middle" class="heading">Nginx proxy MIG</text>
  <text x="667" y="269" text-anchor="middle" class="small">Reverse proxy · multiple zones</text>
  <rect x="552" y="295" width="105" height="93" rx="10" class="blue"/>
  <text x="604" y="330" text-anchor="middle" class="body" font-weight="700">Nginx</text>
  <text x="604" y="355" text-anchor="middle" class="small">zone A</text>
  <rect x="676" y="295" width="105" height="93" rx="10" class="blue"/>
  <text x="728" y="330" text-anchor="middle" class="body" font-weight="700">Nginx</text>
  <text x="728" y="355" text-anchor="middle" class="small">zone B</text>
  <text x="667" y="416" text-anchor="middle" class="small">Static site + /api/ proxying</text>

  <rect x="865" y="237" width="220" height="155" rx="14" class="blue"/>
  <text x="975" y="280" text-anchor="middle" class="heading">Internal</text>
  <text x="975" y="304" text-anchor="middle" class="heading">Passthrough LB</text>
  <text x="975" y="341" text-anchor="middle" class="small">Stable private endpoint</text>
  <text x="975" y="365" text-anchor="middle" class="small">TCP :8081</text>

  <rect x="1145" y="207" width="280" height="230" rx="14" class="card"/>
  <text x="1285" y="245" text-anchor="middle" class="heading">Backend MIG</text>
  <text x="1285" y="269" text-anchor="middle" class="small">Regional · multiple zones</text>
  <rect x="1167" y="295" width="108" height="93" rx="10" class="blue"/>
  <text x="1221" y="329" text-anchor="middle" class="body" font-weight="700">Go API</text>
  <text x="1221" y="353" text-anchor="middle" class="small">Docker · zone A</text>
  <text x="1221" y="374" text-anchor="middle" class="small">+ PostgreSQL</text>
  <rect x="1295" y="295" width="108" height="93" rx="10" class="blue"/>
  <text x="1349" y="329" text-anchor="middle" class="body" font-weight="700">Go API</text>
  <text x="1349" y="353" text-anchor="middle" class="small">Docker · zone B</text>
  <text x="1349" y="374" text-anchor="middle" class="small">+ PostgreSQL</text>
  <text x="1285" y="416" text-anchor="middle" class="small">Health checks + horizontal scaling</text>

  <path d="M210 315 H260" class="edge"/>
  <path d="M465 315 H530" class="edge"/>
  <path d="M805 315 H865" class="edge"/>
  <path d="M1085 315 H1145" class="edge"/>
  <text x="235" y="300" text-anchor="middle" class="small">HTTP</text>
  <text x="497" y="300" text-anchor="middle" class="small">Public</text>
  <text x="835" y="300" text-anchor="middle" class="small">/api/</text>
  <text x="1115" y="300" text-anchor="middle" class="small">Private</text>

  <rect x="50" y="526" width="1400" height="56" rx="10" fill="#fff" stroke="#d6dee8"/>
  <text x="750" y="550" text-anchor="middle" class="body" font-weight="700">GCP firewall rules restrict load-balancer ingress and proxy-to-backend traffic.</text>
  <text x="750" y="570" text-anchor="middle" class="small">Each backend VM currently runs its own PostgreSQL container.</text>
</svg>
